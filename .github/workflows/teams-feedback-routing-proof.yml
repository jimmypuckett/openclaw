name: Teams feedback routing proof

on:
  push:
    branches: [msteams-feedback-routing-proof]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      OPENCLAW_VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Install pinned package manager and dependencies
        run: |
          npm install --global pnpm@12.1.0
          pnpm install --frozen-lockfile
      - name: Record exact source identity
        run: git rev-parse HEAD
      - name: Feedback authorization and real subscriber regression
        run: node scripts/run-vitest.mjs extensions/msteams/src/monitor-handler.feedback-authz.test.ts
